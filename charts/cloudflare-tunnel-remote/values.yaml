# Default values for cloudflare-tunnel-remote.

# Cloudflare parameters.
cloudflare:
  # The token for the remotely-managed tunnel. Required unless existingSecret is set.
  # Ignored when existingSecret is set.
  tunnel_token: ""
  # If set, no Secret is created by this chart; the named, pre-existing Secret is
  # used instead (e.g. one managed by External Secrets, Sealed Secrets, or SOPS).
  existingSecret: ""
  # Key within the Secret (whether chart-created or existing) that holds the token.
  existingSecretKey: tunnelToken

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  # If supplied, this overrides "latest"
  tag: ""

replicaCount: 2

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

metricsService:
  annotations: {}
  labels: {}

serviceMonitor:
  enabled: false
  # Additional labels to add to the ServiceMonitor (e.g. to match a Prometheus instance selector)
  labels: {}
  annotations: {}
  # Namespace to create the ServiceMonitor in; defaults to the release namespace
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics

# Security items common to everything in the pod.  Here we require that it
# does not run as the user defined in the image, literally named "nonroot".
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

# Security items for one container. We lock it down.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

# Default affinity is to spread out over nodes; use this to override.
affinity: {}
