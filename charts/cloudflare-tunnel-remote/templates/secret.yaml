{{- if not .Values.cloudflare.existingSecret }}
# This credentials secret allows cloudflared to authenticate itself
# to the Cloudflare infrastructure.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudflare-tunnel-remote.fullname" . }}
  labels:
    {{- include "cloudflare-tunnel-remote.labels" . | nindent 4 }}
stringData:
  {{ include "cloudflare-tunnel-remote.secretKey" . }}: {{ required "A tunnel token is required: set cloudflare.tunnel_token, or point cloudflare.existingSecret at a pre-existing Secret." .Values.cloudflare.tunnel_token | quote }}
{{- end }}
