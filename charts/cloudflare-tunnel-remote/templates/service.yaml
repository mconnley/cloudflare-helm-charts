apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudflare-tunnel-remote.fullname" . }}-metrics
  labels:
    {{- include "cloudflare-tunnel-remote.labels" . | nindent 4 }}
    {{- with .Values.metricsService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metricsService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    pod: cloudflared
  ports:
    - name: metrics
      port: 5900
      targetPort: 2000
      protocol: TCP
